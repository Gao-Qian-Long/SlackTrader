name: Signed Windows release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: signed-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - name: Build signed installer and release metadata
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:build -- --tag "$env:RELEASE_TAG"
      - name: Upload update assets to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path 'release' $env:RELEASE_TAG
          $names = @("SlackTrader-$env:RELEASE_TAG-Setup-x64.exe", "SlackTrader-$env:RELEASE_TAG-Setup-x64.exe.sig", "SlackTrader-$env:RELEASE_TAG-Portable-x64.exe", "SlackTrader-$env:RELEASE_TAG-Source.zip", 'latest.json', 'SHA256SUMS.txt')
          foreach ($name in $names) {
            gh release upload $env:RELEASE_TAG (Join-Path $dir $name) --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
