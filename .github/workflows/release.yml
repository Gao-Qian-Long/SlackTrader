name: Signed Windows release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (v0.x, e.g. v0.6)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: signed-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Detect already uploaded release assets
        id: assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @("SlackTrader-$env:RELEASE_TAG-Setup-x64.exe", "SlackTrader-$env:RELEASE_TAG-Portable-x64.exe", 'latest.json')
          $uploaded = @($release.assets | Where-Object { $_.size -gt 0 } | ForEach-Object { $_.name })
          $ready = @($expected | Where-Object { $_ -notin $uploaded }).Count -eq 0
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.assets.outputs.ready != 'true'
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        if: steps.assets.outputs.ready != 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.assets.outputs.ready != 'true'
      - run: npm ci
        if: steps.assets.outputs.ready != 'true'
      - run: npm test
        if: steps.assets.outputs.ready != 'true'
      - name: Build signed installer and release metadata
        if: steps.assets.outputs.ready != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:build -- --tag "$env:RELEASE_TAG"
      - name: Upload update assets to the release
        if: steps.assets.outputs.ready != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path 'release' $env:RELEASE_TAG
          $names = @("SlackTrader-$env:RELEASE_TAG-Setup-x64.exe", "SlackTrader-$env:RELEASE_TAG-Portable-x64.exe", 'latest.json')
          foreach ($name in $names) {
            gh release upload $env:RELEASE_TAG (Join-Path $dir $name) --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
