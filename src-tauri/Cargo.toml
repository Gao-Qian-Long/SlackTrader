[package]
name = "bluetooth-assistant"
version = "0.5.0"
description = "A discreet, lightweight intraday market ticker"
authors = ["Bluetooth Assistant"]
edition = "2021"

[lib]
name = "bluetooth_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
encoding_rs = "0.8"
httpdate = "1"
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"
